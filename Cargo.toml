[package]
name = "aloecrypt_core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Michael Godfrey", "aloecraft.org"]
readme = "README.md"
repository = "https://github.com/Aloecraft-org/aloecrypt_core"
description = """
"""
keywords = ["crypto"]
categories = [ "cryptography", "no-std" ]

[features]
default = ["slip39_words", "bip39_words", "host_rng", "host_kdf"]
slip39_words = []
bip39_words = []
# Host entropy source, used only to seed the example binaries. The library never
# calls getrandom -- AloeRng is seeded by the caller -- but getrandom has no
# backend for bare-metal or wasm32-unknown-unknown, so an unconditional
# dependency on it makes those targets unbuildable. Gated so it can be left out.
host_rng = ["dep:getrandom"]
# Host-scale password KDF memory. With this on, pbkdf runs Argon2id at the
# OWASP-recommended 19 MiB, which needs an allocator; without it, the memory
# cost drops to a fixed block that lives on the stack, sized for the embedded
# target. The interface is identical either way -- see src/pkdf.rs.
host_kdf = ["argon2/alloc"]

# Argon2id in an unoptimized build is slow enough to dominate the test suite,
# and there is nothing of ours to debug inside it. Optimize just the KDF and
# its hash even in dev, the same way most crates treat their crypto backends.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = "z"   # Optimizes aggressively for binary size rather than speed.
lto = true        # Link-time optimization removes dead code across boundaries.
codegen-units = 1 # Better optimization, slower compile time.
panic = "abort"   # Removes unwinding code.
strip = true      # Strips symbols and debug info from the Linux ELF binary.

[dependencies]
ml-kem = { version = "0.3.2" }
ml-dsa = { version = "0.1.1", default-features = false }
getrandom = { version = "0.2.17", default-features = false, optional = true }
rand_chacha = { version = "0.10", default-features = false }
zerocopy = { version = "0.8.48", default-features = false, features = ["derive"]}
rand_core = { version = "0.10" }
# default-features pulls in getrandom via crypto-common/rand_core, which has no
# backend for bare-metal or wasm32-unknown-unknown. The library only uses
# AeadInPlace, so none of the default features are needed.
chacha20poly1305 = { version = "0.10", default-features = false }
argon2 = { version = "0.6.0-rc.8", default-features = false }
sha3 = {version = "0.11.0-rc.7", default-features = false}
digest = {version = "0.11.2", features = ["mac"]}
hmac = "0.13.0"
sha2 = "0.11.0"
sha1 = "0.11.0"

url = { version="2.5", default-features = false }
data-encoding = { version="2.5", default-features = false }

[package.metadata.cargo-machete]
ignored = ["zerocopy"]

[build-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

# Only these three seed themselves from the host OS; shamir and totp take their
# entropy as a parameter and build without host_rng.
[[bin]]
name = "align"
required-features = ["host_rng"]

[[bin]]
name = "bip39"
required-features = ["host_rng"]

[[bin]]
name = "slip39"
required-features = ["host_rng"]
